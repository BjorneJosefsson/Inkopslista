<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkop  ">
<title>Inköpslistan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #F5F1E7;
    --card: #FFFFFF;
    --ink: #29261F;
    --ink-soft: #756D5E;
    --ink-faint: #A9A192;
    --line: #E1DACA;
    --tomato: #BC4433;
    --leaf: #55704A;
  }

  *{ box-sizing: border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; padding:2.25rem 1.25rem 4rem; }
  header{ margin-bottom:1.75rem; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub{ color:var(--ink-soft); font-size:14px; margin:0; }

  .whoami{ display:flex; align-items:center; gap:8px; margin-bottom:1rem; font-size:13px; color:var(--ink-soft); }
  .whoami input{ border:1px solid var(--line); border-radius:7px; padding:5px 9px; font-size:13px; font-family:'Inter',sans-serif; background:var(--card); color:var(--ink); width:140px; }
  .whoami input:focus{ outline:none; border-color:var(--tomato); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 1.25rem; padding-bottom:1.25rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .count{ font-size:14px; color:var(--ink-soft); }
  .count strong{ color:var(--ink); font-weight:600; }
  .btns{ display:flex; gap:8px; }

  button.pill{ font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; }
  button.pill:hover{ border-color:var(--ink-faint); }
  button.pill.active{ background:var(--tomato); border-color:var(--tomato); color:#FFF5F3; }

  section.category{ margin-bottom:1.6rem; }
  .cat-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:0.6rem; }
  .cat-head h2{ font-family:'Fraunces',serif; font-weight:500; font-size:18px; margin:0; }
  .cat-head .n{ font-size:12px; color:var(--ink-faint); }

  ul.items{ list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  li.item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-bottom:1px solid var(--line); }
  li.item:last-child{ border-bottom:none; }

  .box{ width:19px; height:19px; min-width:19px; border-radius:5px; border:1.5px solid var(--ink-faint); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center; color:transparent; font-size:13px; line-height:1; transition:all 0.15s; }
  li.item.wanted .box{ background:var(--tomato); border-color:var(--tomato); color:#fff; }
  li.item.shop-done .box{ background:var(--leaf); border-color:var(--leaf); color:#fff; }

  .name{ flex:1; font-size:14.5px; cursor:pointer; user-select:none; }
  li.item.shop-done .name{ color:var(--ink-faint); text-decoration:line-through; }
  .by{ font-size:11.5px; color:var(--ink-faint); display:block; margin-top:1px; }

  .del-btn{ background:none; border:none; color:var(--ink-faint); font-size:17px; cursor:pointer; padding:0 2px; line-height:1; }
  .del-btn:hover{ color:var(--tomato); }

  .add-wrap{ border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; overflow:hidden; }
  .add-row{ display:flex; gap:8px; padding:9px 12px; background:var(--paper); border-top:1px solid var(--line); }
  .add-row input{ flex:1; border:none; background:transparent; font-size:13.5px; font-family:'Inter',sans-serif; color:var(--ink); padding:4px 0; }
  .add-row input::placeholder{ color:var(--ink-faint); }
  .add-row input:focus{ outline:none; }
  .add-row button{ border:none; background:var(--leaf); color:#fff; font-size:18px; font-weight:300; border-radius:6px; padding:0 12px; cursor:pointer; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:3rem 1rem; font-family:'Fraunces',serif; font-style:italic; }
  footer{ margin-top:2rem; text-align:center; font-size:12px; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Inköpslistan</h1>
    <p class="sub">Delad lista för Willys</p>
  </header>

  <div class="whoami">
    <span>Ditt namn:</span>
    <input type="text" id="nameInput" placeholder="t.ex. Anna" maxlength="20">
  </div>

  <div class="toolbar">
    <div class="count" id="countLabel">Ansluter…</div>
    <div class="btns">
      <button class="pill" id="resetBtn">Ny vecka</button>
      <button class="pill" id="modeBtn">Handla-läge</button>
    </div>
  </div>

  <div id="lists"></div>
  <footer>Listan synkas i realtid – ändringar syns direkt hos båda.</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN_Afs3-fXbCURm8VBC8ydUb8_qKEzfb4",
  authDomain: "inkopslista-94013.firebaseapp.com",
  databaseURL: "https://inkopslista-94013-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "inkopslista-94013",
  storageBucket: "inkopslista-94013.firebasestorage.app",
  messagingSenderId: "895498723280",
  appId: "1:895498723280:web:40b840374dd07fb17d63d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const itemsRef = ref(db, 'items');

const CATEGORIES = [
  { id:'frukt',    name:'Frukt & grönt',     items:['Bananer','Äpplen','Tomater','Gurka','Sallad','Lök','Vitlök','Potatis','Citron','Paprika','Avokado','Morötter'] },
  { id:'brod',     name:'Bröd & bageri',      items:['Formbröd','Rågbröd','Frallor','Knäckebröd','Kanelbullar'] },
  { id:'mejeri',   name:'Mejeri & ägg',       items:['Mjölk','Yoghurt','Smör','Ägg','Ost','Grädde','Crème fraîche'] },
  { id:'kott',     name:'Kött, fisk & chark', items:['Kycklingfilé','Köttfärs','Bacon','Skinka','Lax','Korv'] },
  { id:'skafferi', name:'Skafferi',            items:['Pasta','Ris','Havregryn','Krossade tomater','Matolja','Kryddor','Kaffe','Te','Socker','Mjöl'] },
  { id:'fryst',    name:'Fryst',              items:['Frysta grönsaker','Glass','Pizza','Fiskpinnar','Frysta bär'] },
  { id:'dryck',    name:'Dryck',              items:['Läsk','Juice','Vatten','Öl'] },
  { id:'snacks',   name:'Snacks & godis',     items:['Chips','Choklad','Godis','Nötter','Kex'] },
  { id:'hygien',   name:'Hygien & städ',      items:['Toalettpapper','Diskmedel','Tvättmedel','Tandkräm','Schampo','Hushållspapper'] },
  { id:'ovrigt',   name:'Övrigt',             items:[] }
];

function slug(s){ return s.toLowerCase().replace(/[^a-zåäö0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function buildDefaults(){
  const items = {};
  CATEGORIES.forEach(cat => {
    cat.items.forEach(name => {
      const id = cat.id + '__' + slug(name);
      items[id] = { id, catId:cat.id, name, wanted:false, done:false, custom:false, addedBy:null };
    });
  });
  return items;
}

// Local state — single source of truth for rendering
let items = {};
let mode = 'plan';
let myName = localStorage.getItem('willys-namn') || '';
let ignoreNext = false; // skip next Firebase echo after our own save

document.getElementById('nameInput').value = myName;

// Firebase listener — always sync from server except when we just saved
onValue(itemsRef, (snapshot) => {
  const data = snapshot.val();
  if(!data){
    items = buildDefaults();
    set(itemsRef, items);
  } else {
    items = data;
  }
  render();
});

// Save one field to Firebase
function saveToFirebase(id, field, val){
  const copy = { ...items[id], [field]: val };
  items[id] = copy; // update local immediately
  render();         // re-render immediately
  set(ref(db, 'items/' + id), copy); // then push to Firebase
}

function toggleWanted(id){
  const it = items[id]; if(!it) return;
  const wanted = !it.wanted;
  const done = wanted ? it.done : false;
  items[id] = { ...it, wanted, done };
  render();
  set(ref(db, 'items/' + id), items[id]);
}

function toggleDone(id){
  const it = items[id]; if(!it) return;
  items[id] = { ...it, done: !it.done };
  render();
  set(ref(db, 'items/' + id), items[id]);
}

function addCustomItem(catId, name){
  name = name.trim(); if(!name) return;
  const id = catId + '__custom-' + Date.now();
  items[id] = { id, catId, name, wanted:true, done:false, custom:true, addedBy: myName || null };
  render();
  set(ref(db, 'items/' + id), items[id]);
}

function deleteItem(id){
  delete items[id];
  render();
  set(ref(db, 'items/' + id), null);
}

function resetWeek(){
  Object.keys(items).forEach(id => { items[id].wanted = false; items[id].done = false; });
  render();
  set(itemsRef, items);
}

function render(){
  const listsEl = document.getElementById('lists');
  const countEl = document.getElementById('countLabel');
  const modeBtn = document.getElementById('modeBtn');

  const all = Object.values(items);
  const wanted = all.filter(i => i.wanted);
  const done = wanted.filter(i => i.done).length;

  if(mode === 'plan'){
    const n = wanted.length;
    countEl.textContent = n === 0 ? 'Bocka vad ni ska handla' : n + ' ' + (n === 1 ? 'vara' : 'varor') + ' på listan';
  } else {
    countEl.textContent = done + ' av ' + wanted.length + ' hämtade';
  }

  modeBtn.textContent = mode === 'shop' ? 'Planera-läge' : 'Handla-läge';
  modeBtn.className = mode === 'shop' ? 'pill active' : 'pill';

  listsEl.innerHTML = '';

  if(mode === 'shop' && wanted.length === 0){
    listsEl.innerHTML = '<div class="empty">Listan är tom. Bocka varor i planera-läget.</div>';
    return;
  }

  CATEGORIES.forEach(cat => {
    let catItems = all.filter(i => i.catId === cat.id);
    if(mode === 'shop'){
      catItems = catItems.filter(i => i.wanted);
      if(catItems.length === 0) return;
    }

    const section = document.createElement('section');
    section.className = 'category';

    const planCount = catItems.filter(i => i.wanted).length;
    const doneCount = catItems.filter(i => i.done).length;
    const countStr = mode === 'shop' ? doneCount + '/' + planCount : planCount > 0 ? planCount + ' valda' : '';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<h2>' + cat.name + '</h2>' + (countStr ? '<span class="n">' + countStr + '</span>' : '');
    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'items';

    catItems.forEach(it => {
      const isShop = mode === 'shop';
      const active = isShop ? it.done : it.wanted;

      const li = document.createElement('li');
      li.className = 'item' + (isShop && it.done ? ' shop-done' : '') + (!isShop && it.wanted ? ' wanted' : '');

      const box = document.createElement('div');
      box.className = 'box';
      box.textContent = active ? '✓' : '';
      box.addEventListener('click', () => isShop ? toggleDone(it.id) : toggleWanted(it.id));

      const nameWrap = document.createElement('span');
      nameWrap.className = 'name';
      nameWrap.addEventListener('click', () => isShop ? toggleDone(it.id) : toggleWanted(it.id));

      const nameText = document.createElement('span');
      nameText.textContent = it.name;
      nameWrap.appendChild(nameText);

      if(it.custom && it.addedBy){
        const by = document.createElement('span');
        by.className = 'by';
        by.textContent = 'av ' + it.addedBy;
        nameWrap.appendChild(by);
      }

      li.appendChild(box);
      li.appendChild(nameWrap);

      if(it.custom && mode === 'plan'){
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '×';
        del.addEventListener('click', () => deleteItem(it.id));
        li.appendChild(del);
      }

      ul.appendChild(li);
    });

    section.appendChild(ul);

    if(mode === 'plan'){
      const addWrap = document.createElement('div');
      addWrap.className = 'add-wrap';
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      const inp = document.createElement('input');
      inp.placeholder = 'Lägg till vara…';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+';
      const doAdd = () => { addCustomItem(cat.id, inp.value); inp.value = ''; };
      addBtn.addEventListener('click', doAdd);
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });
      addRow.appendChild(inp);
      addRow.appendChild(addBtn);
      addWrap.appendChild(addRow);
      section.appendChild(addWrap);
    }

    listsEl.appendChild(section);
  });
}

document.getElementById('modeBtn').addEventListener('click', () => {
  mode = mode === 'shop' ? 'plan' : 'shop';
  render();
});

document.getElementById('resetBtn').addEventListener('click', resetWeek);

document.getElementById('nameInput').addEventListener('change', e => {
  myName = e.target.value.trim();
  localStorage.setItem('willys-namn', myName);
});
</script>
</body>
</html>
