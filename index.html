<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Willys">
<title>Inköpslistan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #F5F1E7;
    --card: #FFFFFF;
    --ink: #29261F;
    --ink-soft: #756D5E;
    --ink-faint: #A9A192;
    --line: #E1DACA;
    --tomato: #BC4433;
    --leaf: #55704A;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 4rem;
  }

  header{ margin-bottom: 1.25rem; }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }

  .sub{ color: var(--ink-soft); font-size: 14px; margin: 0; }

  .whoami{
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 1rem 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .whoami input{
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    background: var(--card);
    color: var(--ink);
    width: 140px;
  }

  .whoami input:focus{ outline: none; border-color: var(--tomato); }

  .toolbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .count{ font-size: 14px; color: var(--ink-soft); }
  .count strong{ color: var(--ink); font-weight: 600; }

  .btns{ display: flex; gap: 8px; flex-wrap: wrap; }

  button.pill{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  button.pill:hover{ border-color: var(--ink-faint); }

  button.pill.active{
    background: var(--tomato);
    border-color: var(--tomato);
    color: #FFF5F3;
  }

  .sync-dot{
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #aaa;
    margin-right: 5px;
    vertical-align: middle;
  }
  .sync-dot.ok{ background: var(--leaf); }
  .sync-dot.err{ background: var(--tomato); }

  section.category{ margin-bottom: 1.6rem; }

  .cat-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }

  .cat-head h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    margin: 0;
  }

  .cat-head .n{ font-size: 12px; color: var(--ink-faint); }

  ul.items{
    list-style: none;
    margin: 0; padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  li.item{
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }

  li.item:last-child{ border-bottom: none; }

  .box{
    width: 19px; height: 19px; min-width: 19px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-faint);
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 13px;
    line-height: 1;
  }

  li.item.checked .box{
    background: var(--tomato);
    border-color: var(--tomato);
    color: #fff;
  }

  .name{
    flex: 1;
    font-size: 14.5px;
    cursor: pointer;
    user-select: none;
  }

  li.item.checked .name{
    color: var(--ink-faint);
    text-decoration: line-through;
  }

  .by{
    font-size: 11.5px;
    color: var(--ink-faint);
    display: block;
    margin-top: 1px;
  }

  .del{
    background: none; border: none;
    color: var(--ink-faint);
    font-size: 17px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .del:hover{ color: var(--tomato); }

  .addrow{
    display: flex;
    gap: 8px;
    padding: 9px 12px;
    background: var(--paper);
  }

  .addrow input{
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    background: var(--card);
    color: var(--ink);
  }

  .addrow input:focus{ outline: none; border-color: var(--tomato); }

  .addrow button{
    border: none;
    background: var(--leaf);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    border-radius: 7px;
    padding: 0 14px;
    cursor: pointer;
  }

  .addrow button:hover{ opacity: 0.9; }

  .empty{
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 3rem 1rem;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  footer{
    margin-top: 2rem;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Inköpslistan</h1>
    <p class="sub">Delad lista för Willys</p>
  </header>

  <div class="whoami">
    <span>Ditt namn:</span>
    <input type="text" id="nameInput" placeholder="t.ex. Anna" maxlength="20">
  </div>

  <div class="toolbar">
    <div class="count" id="countLabel">
      <span class="sync-dot" id="syncDot"></span>Ansluter…
    </div>
    <div class="btns">
      <button class="pill" id="modeBtn">Handla-läge</button>
      <button class="pill" id="resetBtn">Ny vecka</button>
    </div>
  </div>

  <div id="lists"></div>

  <footer>Listan synkas i realtid – ändringar syns direkt hos båda.</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN_Afs3-fXbCURm8VBC8ydUb8_qKEzfb4",
  authDomain: "inkopslista-94013.firebaseapp.com",
  databaseURL: "https://inkopslista-94013-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "inkopslista-94013",
  storageBucket: "inkopslista-94013.firebasestorage.app",
  messagingSenderId: "895498723280",
  appId: "1:895498723280:web:40b840374dd07fb17d63d5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const itemsRef = ref(db, 'items');

const CATEGORIES = [
  { id: 'frukt',    name: 'Frukt & grönt',      items: ['Bananer','Äpplen','Tomater','Gurka','Sallad','Lök','Vitlök','Potatis','Citron','Paprika','Avokado','Morötter'] },
  { id: 'brod',     name: 'Bröd & bageri',       items: ['Formbröd','Rågbröd','Frallor','Knäckebröd','Kanelbullar'] },
  { id: 'mejeri',   name: 'Mejeri & ägg',        items: ['Mjölk','Yoghurt','Smör','Ägg','Ost','Grädde','Crème fraîche'] },
  { id: 'kott',     name: 'Kött, fisk & chark',  items: ['Kycklingfilé','Köttfärs','Bacon','Skinka','Lax','Korv'] },
  { id: 'skafferi', name: 'Skafferi',             items: ['Pasta','Ris','Havregryn','Krossade tomater','Matolja','Kryddor','Kaffe','Te','Socker','Mjöl'] },
  { id: 'fryst',    name: 'Fryst',               items: ['Frysta grönsaker','Glass','Pizza','Fiskpinnar','Frysta bär'] },
  { id: 'dryck',    name: 'Dryck',               items: ['Läsk','Juice','Vatten','Öl'] },
  { id: 'snacks',   name: 'Snacks & godis',      items: ['Chips','Choklad','Godis','Nötter','Kex'] },
  { id: 'hygien',   name: 'Hygien & städ',       items: ['Toalettpapper','Diskmedel','Tvättmedel','Tandkräm','Schampo','Hushållspapper'] },
  { id: 'ovrigt',   name: 'Övrigt',              items: [] }
];

function slug(s){ return s.toLowerCase().replace(/[^a-zåäö0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function buildDefaults(){
  const items = {};
  CATEGORIES.forEach(cat => {
    cat.items.forEach(name => {
      const id = cat.id + '__' + slug(name);
      items[id] = { id, catId: cat.id, name, wanted: false, done: false, custom: false, addedBy: null };
    });
  });
  return items;
}

let state = { items: {}, mode: 'plan', myName: '' };
let saving = false;

// Load name from localStorage
state.myName = localStorage.getItem('willys-namn') || '';
document.getElementById('nameInput').value = state.myName;

function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (status === 'ok' ? 'ok' : status === 'err' ? 'err' : '');
}

// Listen to Firebase in real-time
onValue(itemsRef, (snapshot) => {
  if(saving) return;
  const data = snapshot.val();
  if(data){
    state.items = data;
  } else {
    state.items = buildDefaults();
    set(itemsRef, state.items);
  }
  setSyncStatus('ok');
  render();
}, (error) => {
  setSyncStatus('err');
  console.error(error);
});

async function saveItem(id, patch){
  saving = true;
  try{
    await update(ref(db, 'items/' + id), patch);
    setSyncStatus('ok');
  } catch(e){
    setSyncStatus('err');
  }
  saving = false;
}

async function removeItem(id){
  saving = true;
  try{
    await set(ref(db, 'items/' + id), null);
    setSyncStatus('ok');
  } catch(e){ setSyncStatus('err'); }
  saving = false;
}

function toggleWanted(id){
  const it = state.items[id];
  if(!it) return;
  const wanted = !it.wanted;
  const done = wanted ? it.done : false;
  state.items[id] = { ...it, wanted, done };
  render();
  saveItem(id, { wanted, done });
}

function toggleDone(id){
  const it = state.items[id];
  if(!it) return;
  const done = !it.done;
  state.items[id] = { ...it, done };
  render();
  saveItem(id, { done });
}

function addCustomItem(catId, name){
  name = name.trim();
  if(!name) return;
  const id = catId + '__custom-' + Date.now();
  const item = { id, catId, name, wanted: true, done: false, custom: true, addedBy: state.myName || null };
  state.items[id] = item;
  render();
  saveItem(id, item);
}

function deleteItem(id){
  delete state.items[id];
  render();
  removeItem(id);
}

async function resetWeek(){
  const updates = {};
  Object.keys(state.items).forEach(id => {
    state.items[id].wanted = false;
    state.items[id].done = false;
    updates['items/' + id + '/wanted'] = false;
    updates['items/' + id + '/done'] = false;
  });
  render();
  saving = true;
  try{ await update(ref(db), updates); setSyncStatus('ok'); } catch(e){ setSyncStatus('err'); }
  saving = false;
}

function render(){
  const listsEl = document.getElementById('lists');
  const countEl = document.getElementById('countLabel');
  const dot = document.getElementById('syncDot');

  const allItems = Object.values(state.items);
  const wanted = allItems.filter(i => i.wanted);
  const done = wanted.filter(i => i.done).length;

  const dotHtml = '<span class="sync-dot ' + dot.className.replace('sync-dot','').trim() + '" id="syncDot"></span>';

  if(state.mode === 'plan'){
    const n = wanted.length;
    countEl.innerHTML = dotHtml + (n === 0 ? 'Bocka vad ni ska handla' : '<strong>' + n + '</strong> ' + (n === 1 ? 'vara' : 'varor') + ' på listan');
  } else {
    countEl.innerHTML = dotHtml + '<strong>' + done + '</strong> av <strong>' + wanted.length + '</strong> hämtade';
  }

  document.getElementById('modeBtn').classList.toggle('active', state.mode === 'shop');
  document.getElementById('modeBtn').textContent = state.mode === 'shop' ? 'Planera-läge' : 'Handla-läge';

  listsEl.innerHTML = '';

  if(state.mode === 'shop' && wanted.length === 0){
    listsEl.innerHTML = '<div class="empty">Listan är tom. Bocka för varor i planera-läget.</div>';
    return;
  }

  CATEGORIES.forEach(cat => {
    let catItems = allItems.filter(i => i.catId === cat.id);
    if(state.mode === 'shop'){
      catItems = catItems.filter(i => i.wanted);
      if(catItems.length === 0) return;
    }

    const section = document.createElement('section');
    section.className = 'category';

    const planCount = catItems.filter(i => i.wanted).length;
    const doneCount = catItems.filter(i => i.done).length;
    const countStr = state.mode === 'shop' ? doneCount + '/' + planCount : planCount + ' valda';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<h2>' + cat.name + '</h2><span class="n">' + countStr + '</span>';
    section.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'items';

    catItems.forEach(it => {
      const isShop = state.mode === 'shop';
      const active = isShop ? it.done : it.wanted;

      const li = document.createElement('li');
      li.className = 'item' + (active ? ' checked' : '');

      const box = document.createElement('div');
      box.className = 'box';
      box.textContent = active ? '✓' : '';
      box.addEventListener('click', () => isShop ? toggleDone(it.id) : toggleWanted(it.id));

      const name = document.createElement('span');
      name.className = 'name';
      name.addEventListener('click', () => isShop ? toggleDone(it.id) : toggleWanted(it.id));

      const nameText = document.createElement('span');
      nameText.textContent = it.name;
      name.appendChild(nameText);

      if(it.custom && it.addedBy){
        const by = document.createElement('span');
        by.className = 'by';
        by.textContent = 'av ' + it.addedBy;
        name.appendChild(by);
      }

      li.appendChild(box);
      li.appendChild(name);

      if(it.custom && state.mode === 'plan'){
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.setAttribute('aria-label', 'Ta bort ' + it.name);
        del.addEventListener('click', () => deleteItem(it.id));
        li.appendChild(del);
      }

      ul.appendChild(li);
    });

    section.appendChild(ul);

    if(state.mode === 'plan'){
      const addrow = document.createElement('div');
      addrow.className = 'addrow';
      const input = document.createElement('input');
      input.placeholder = 'Lägg till egen vara';
      const addBtn = document.createElement('button');
      addBtn.textContent = 'Lägg till';
      const doAdd = () => { addCustomItem(cat.id, input.value); input.value = ''; };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });
      addrow.appendChild(input);
      addrow.appendChild(addBtn);
      section.appendChild(addrow);
    }

    listsEl.appendChild(section);
  });
}

document.getElementById('modeBtn').addEventListener('click', () => {
  state.mode = state.mode === 'shop' ? 'plan' : 'shop';
  render();
});

document.getElementById('resetBtn').addEventListener('click', resetWeek);

const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('change', () => {
  state.myName = nameInput.value.trim();
  localStorage.setItem('willys-namn', state.myName);
});
</script>
</body>
</html>
